<!DOCTYPE html>

<html>

  <head>


    <title>
      profile-card
    </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <script src="https://kit.fontawesome.com/557b27e9d6.js" crossorigin="anonymous"></script>

  </head>

  <body>
    
    <div class="profile-card">
      <!-- Front card -->
      <div class="front-card">

        <div class="top-card">
          <div class="owner-infos">

            <div class="full-line">
              <p class="full-name"><span>Mounir</span> Anzar</p>
              <hr>
            </div>
            <p class="stack">Full-stack developper</p>

          </div>
          
          <div class="img-container">
            <img src="assets/my-picture.jpeg">
          </div>

        </div>

        <div class="personal-infos">

          <div class="icon-info">
            <i class="fa-solid fa-phone"></i>
            <p class="phone-number">+212 6 ** ** ** 49</p>
          </div>

          <div class="icon-info">
            <i class="fa-solid fa-desktop"></i>
            <p class="my-website">www.website.com</p>
          </div>

          <div class="icon-info">
            <i class="fa-solid fa-envelope"></i>
            <p class="mail-address">mouniranzar0001@gmail.com</p>
          </div>
        </div>
      </div>

      <!-- Back Card -->
      <div class="back-card">
        <img src="assets/back-card-image.png">
      </div>

    </div>

  </body>

</html>
